name: Local Patch Build

# Builds an installable APK from upstream main + local-patches/*.patch.
#
# This fork only ever *adds* files, so `git merge upstream/main` never conflicts. If a patch stops
# applying because upstream moved, this workflow fails loudly instead of producing a stale APK.

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: Product flavor to build
        type: choice
        options:
          - foss
          - gms
        default: foss
      upstream_ref:
        description: Upstream ref to build against
        type: string
        default: main
  push:
    branches: [main]
    paths:
      - 'local-patches/**'
      - '.github/workflows/local-build.yml'

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.flavor || 'foss' }} debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FLAVOR: ${{ inputs.flavor || 'foss' }}
      UPSTREAM_REF: ${{ inputs.upstream_ref || 'main' }}
    steps:
      - name: Check out patch set
        uses: actions/checkout@v4
        with:
          path: patches

      - name: Check out upstream ${{ env.UPSTREAM_REF }}
        uses: actions/checkout@v4
        with:
          repository: vivizzz007/vivi-music
          ref: ${{ env.UPSTREAM_REF }}
          path: src

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply local patches
        working-directory: src
        run: |
          set -euo pipefail
          "${GITHUB_WORKSPACE}/patches/local-patches/apply.sh"

      - name: Grant execute permission for gradlew
        working-directory: src
        run: chmod +x gradlew

      - name: Resolve build inputs
        id: inputs
        working-directory: src
        run: |
          set -euo pipefail
          flavor_cap="$(tr '[:lower:]' '[:upper:]' <<<"${FLAVOR:0:1}")${FLAVOR:1}"
          {
            echo "variant=Universal${flavor_cap}Debug"
            echo "dir=universal${flavor_cap}"
            echo "sha=$(git rev-parse --short HEAD)"
          } >>"${GITHUB_OUTPUT}"

      - name: Summarise what is being built
        working-directory: src
        run: |
          set -euo pipefail
          {
            echo "### Local patch build"
            echo
            echo "| input | value |"
            echo "| --- | --- |"
            echo "| upstream | \`vivizzz007/vivi-music@${UPSTREAM_REF}\` (\`${{ steps.inputs.outputs.sha }}\`) |"
            echo "| task | \`assemble${{ steps.inputs.outputs.variant }}\` |"
            echo "| patches | $(ls "${GITHUB_WORKSPACE}/patches/local-patches"/*.patch | xargs -n1 basename | paste -sd', ' -) |"
            echo
            echo '```'
            git diff --stat
            echo '```'
          } >>"${GITHUB_STEP_SUMMARY}"

      # Signing is pinned to local-patches/debug.keystore, which the apply step copied into the build
      # tree as app/persistent-debug.keystore. A fresh keystore per run would make every APK a
      # different signer for the same package, so Android would refuse to update the installed app.
      - name: Verify the signing key is pinned and stable
        run: |
          set -euo pipefail
          bash "${GITHUB_WORKSPACE}/patches/local-patches/tests/test-signing-key-stability.sh"

      - name: Build APK
        working-directory: src
        run: |
          set -euo pipefail
          ./gradlew --console=plain --no-configuration-cache \
            "assemble${{ steps.inputs.outputs.variant }}"

      # Every APK must carry the pinned certificate, or it cannot be installed over an existing
      # install. The expected fingerprint is committed in local-patches/signing-cert.sha256, and the
      # step fails the job on a mismatch, on a missing pin, or when the checker cannot run.
      - name: Check the APK signing certificate
        working-directory: src
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk -name '*.apk')
          if (( ${#apks[@]} == 0 )); then
            echo "No APK found under app/build/outputs/apk" >&2
            exit 1
          fi
          pin="${GITHUB_WORKSPACE}/patches/local-patches/signing-cert.sha256"
          if [[ ! -f "${pin}" ]]; then
            echo "Missing ${pin}: no APK can be shown to carry the pinned certificate." >&2
            exit 1
          fi
          recorded="$(sed -e 's/#.*//' "${pin}" | awk 'NF { print; exit }')"
          if [[ ! "${recorded}" =~ ^[[:space:]]*[0-9a-fA-F]{64}[[:space:]]*$ ]]; then
            echo "${pin} records no fingerprint on its first content line, so the gate would enforce nothing." >&2
            exit 1
          fi
          {
            echo "### APK signing certificate"
            echo '```'
          } >>"${GITHUB_STEP_SUMMARY}"
          status=0
          python3 "${GITHUB_WORKSPACE}/patches/local-patches/tests/check_apk_signing_cert.py" \
            --expect-file "${pin}" "${apks[@]}" 2>&1 \
            | tee -a "${GITHUB_STEP_SUMMARY}" || status=$?
          echo '```' >>"${GITHUB_STEP_SUMMARY}"
          exit "${status}"

      - name: Run unit tests
        working-directory: src
        run: |
          set -euo pipefail
          ./gradlew --console=plain --no-configuration-cache \
            "test${{ steps.inputs.outputs.variant }}UnitTest"

      # Coverage gate for the JVM-testable code: koverVerify enforces the 95% line rule configured in
      # app/build.gradle.kts. The plain task names are used deliberately - the variant-specific
      # koverXmlReport/koverVerify tasks failed when invoked directly, and the cost of the plain name is
      # only a longer run. Report parsing below is best-effort; the gate itself is the gradle task.
      - name: Verify coverage
        working-directory: src
        run: |
          set -euo pipefail
          ./gradlew --console=plain --no-configuration-cache koverXmlReport koverVerify
          report="$(find . -path '*reports/kover/report.xml' | head -1)"
          if [[ -z "${report}" ]]; then
            report="$(find . -path '*reports/kover/*.xml' | head -1)"
          fi
          echo "kover xml report: ${report:-none}"
          python3 - "${report}" <<'PY'
          import re, sys
          path = sys.argv[1]
          if not path:
              print("no kover XML report found; the gradle koverVerify task is the gate")
              raise SystemExit(0)
          xml = open(path).read()
          counters = re.findall(r'<counter type="LINE" missed="(\d+)" covered="(\d+)"/>', xml)
          if not counters:
              print(f"no LINE counters in {path}")
              raise SystemExit(0)
          missed, covered = map(int, counters[-1])
          print(f"Kover LINE coverage: {covered}/{covered + missed} = {100 * covered / (covered + missed):.1f}%")
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vivi-${{ env.FLAVOR }}-debug-${{ steps.inputs.outputs.sha }}
          path: src/app/build/outputs/apk/${{ steps.inputs.outputs.dir }}/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Record APK checksum
        run: |
          set -euo pipefail
          sha256sum src/app/build/outputs/apk/${{ steps.inputs.outputs.dir }}/debug/*.apk \
            | tee -a "${GITHUB_STEP_SUMMARY}"

      # Report only: upstream sets abortOnError=false, so lint never fails the build, but its report
      # is the quickest way to see API-level mistakes in a patch.
      - name: Lint
        working-directory: src
        continue-on-error: true
        run: |
          set -euo pipefail
          ./gradlew --console=plain --no-configuration-cache \
            "lint${{ steps.inputs.outputs.variant }}"

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-${{ env.FLAVOR }}-${{ steps.inputs.outputs.sha }}
          path: src/app/build/reports/lint-results-*
          if-no-files-found: ignore
          retention-days: 30
