name: Upstream Drift Check

# Two cheap weekly canaries:
#   1. drift     - do local-patches/*.patch still apply to upstream main?
#   2. freshness - is this fork's tree still upstream main plus the files this repo adds?
#
# A red drift run means upstream moved one of the few lines a patch touches (or added a file with the
# same name) - the moment to rebase the patch, rather than finding out when a build is needed.
# A freshness warning means this tree has fallen behind upstream. It never fails the run: Local Patch
# Build compiles upstream main plus these patches, so a lag cannot affect a built APK - which is
# exactly why a lag can hide for weeks. Both jobs point at one upstream repository and branch
# (github.com/vivizzz007/vivi-music, main) and at this fork's own default branch: renaming or moving
# any of those means editing this file.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      fork_ref:
        description: Ref of this fork to compare with upstream main
        type: string
        default: main

permissions:
  contents: read
  issues: write

jobs:
  drift:
    name: Patches still apply to upstream main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: upstream-drift-drift
      cancel-in-progress: false
    steps:
      - name: Check out patch set
        uses: actions/checkout@v4
        with:
          path: patches

      - name: Check out upstream main
        uses: actions/checkout@v4
        with:
          repository: vivizzz007/vivi-music
          ref: main
          path: src

      - name: Apply patches in dry-run mode
        id: check
        working-directory: src
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse --short HEAD)" >>"${GITHUB_OUTPUT}"
          "${GITHUB_WORKSPACE}/patches/local-patches/apply.sh" --check

      - name: Report drift
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          upstream_sha="${{ steps.check.outputs.sha }}"
          {
            echo "### Upstream drift detected"
            echo
            echo "\`local-patches/apply.sh --check\` failed against upstream main (\`${upstream_sha}\`)."
            echo
            echo "That happens either when a patch no longer applies or when the patch set is incomplete -"
            echo "a missing \`local-patches/debug.keystore\` fails this check too, so read the step log above."
            echo
            echo "Rebase the patch onto the new upstream main and regenerate it - see"
            echo "\`local-patches/README.md\`."
          } >>"${GITHUB_STEP_SUMMARY}"

          title="Upstream drift: local patches no longer apply"
          body="\`local-patches/apply.sh --check\` failed against upstream main (\`${upstream_sha}\`). It fails both when a patch no longer applies and when \`local-patches/debug.keystore\` is missing, so read the log: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # The run is failed below by design; this step still has to finish so the summary and the
          # issue carry the reason, even where the repository has Issues switched off. The open issue is
          # found by title rather than through the search index, whose lag raises a duplicate.
          if ! existing="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --limit 1000 --json number,title \
            --jq 'map(select(.title | startswith("Upstream drift"))) | .[0].number // empty')"; then
            existing=""
            echo "::warning::could not list issues while looking for an open drift issue"
          fi
          if [[ -n "${existing}" ]]; then
            gh issue comment "${existing}" --repo "${GITHUB_REPOSITORY}" --body "${body}" \
              || echo "::warning::could not comment on the drift issue"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "${title}" --body "${body}" \
              || echo "::warning::could not create the drift issue"
          fi

      - name: Fail the run so the drift is visible
        if: steps.check.outcome == 'failure'
        run: |
          echo "Patches no longer apply to upstream main - see the job summary." >&2
          exit 1

  freshness:
    name: Fork tree is current with upstream main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Overlapping runs share one group so a scheduled run and a dispatch cannot both create the lag
    # issue, and so that only one of them talks to the issue API at a time.
    concurrency:
      group: upstream-drift-freshness
      cancel-in-progress: false
    steps:
      - name: Check out this fork
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.fork_ref || 'main' }}

      - name: Fetch upstream main
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/vivizzz007/vivi-music.git
          git fetch --no-tags --depth=1 upstream main

      - name: Compare the trees
        id: tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          upstream_sha="$(git rev-parse --short upstream/main)"
          fork_sha="$(git rev-parse --short HEAD)"
          # Path lists are NUL-delimited here: a path may contain a newline, which a line-based count
          # would read as an extra entry. One NUL byte means one path.
          git diff --name-only -z --no-renames --diff-filter=DMTUXB upstream/main HEAD >"${RUNNER_TEMP}/tree-nonadditive.z"
          git diff --name-only -z --no-renames --diff-filter=A upstream/main HEAD >"${RUNNER_TEMP}/tree-added.z"
          nonadditive="$(tr -cd '\0' <"${RUNNER_TEMP}/tree-nonadditive.z" | wc -c)"
          # An upstream file that upstream deleted while this tree still carries it shows as an
          # addition, so every addition is checked against the paths this repo is allowed to own.
          # Both lists are kept, because the summary has to show what the count is made of.
          unexpected=0
          : >"${RUNNER_TEMP}/tree-unexpected.z"
          while IFS= read -r -d '' added; do
            case "${added}" in
              local-patches/*|docs/agent/*) ;;
              .github/workflows/local-build.yml|.github/workflows/upstream-drift.yml) ;;
              *)
                unexpected=$((unexpected + 1))
                printf '%s\0' "${added}" >>"${RUNNER_TEMP}/tree-unexpected.z"
                printf 'unexpected addition: %s\n' "${added}"
                ;;
            esac
          done <"${RUNNER_TEMP}/tree-added.z"
          offending="$((nonadditive + unexpected))"
          # A repository with Issues switched off must not turn a lag into a red run, so the issue
          # channel is optional. "unknown" keeps the reporting steps on the summary-only path and
          # leaves a breadcrumb when the API call itself failed.
          if ! issues_enabled="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.has_issues' 2>/dev/null)"; then
            issues_enabled="unknown"
            echo "::notice::could not read .has_issues for ${GITHUB_REPOSITORY}, so a lag would be reported in this run's summary only"
          fi
          {
            echo "upstream_sha=${upstream_sha}"
            echo "fork_sha=${fork_sha}"
            echo "offending=${offending}"
            echo "nonadditive=${nonadditive}"
            echo "unexpected=${unexpected}"
            echo "issues_enabled=${issues_enabled}"
          } >>"${GITHUB_OUTPUT}"
          echo "Fork ${fork_sha} vs upstream ${upstream_sha}: ${offending} entries that are not files this repo adds (${nonadditive} changed or deleted upstream files, ${unexpected} unexpected additions)"
          # Printed indented: a path may contain a newline, and an unindented line would otherwise be
          # read as a workflow command or close the summary fence.
          printf 'changed or deleted upstream files (first 20):\n'
          tr '\0' '\n' <"${RUNNER_TEMP}/tree-nonadditive.z" | sed -n '1,20{s/^/    /;p}'
          printf 'additions outside the paths this repo owns (first 20):\n'
          tr '\0' '\n' <"${RUNNER_TEMP}/tree-unexpected.z" | sed -n '1,20{s/^/    /;p}'

      - name: Report a lagging tree
        if: steps.tree.outputs.offending != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          FORK_REF: ${{ inputs.fork_ref || 'main' }}
        run: |
          set -euo pipefail
          forked="${FORK_REF}"
          # The summary is markdown and the annotation is a workflow command, so the ref is reduced
          # to the characters a ref can safely carry: anything else (a %0A the dispatch API decoded
          # into a newline, or a backtick that would forge markdown) becomes an underscore.
          safe_ref="$(printf '%s' "${forked}" | tr -c 'A-Za-z0-9._/-' '_')"
          upstream_sha="${{ steps.tree.outputs.upstream_sha }}"
          offending="${{ steps.tree.outputs.offending }}"
          nonadditive="${{ steps.tree.outputs.nonadditive }}"
          unexpected="${{ steps.tree.outputs.unexpected }}"
          issues_enabled="${{ steps.tree.outputs.issues_enabled }}"
          {
            echo "### Fork tree is behind upstream main"
            echo
            echo "\`git diff upstream/main ${safe_ref}\` reports **${offending}** entries that are not files"
            echo "this repo adds, so the tree is no longer \`upstream main + our additions\`."
            echo
            echo "Upstream tip: \`${upstream_sha}\`."
            echo
            echo "Changed or deleted upstream files (${nonadditive}, first 20 shown):"
            echo
            echo '```'
            tr '\0' '\n' <"${RUNNER_TEMP}/tree-nonadditive.z" | sed -n '1,20{s/^/    /;p}'
            echo '```'
            if [[ "${unexpected}" != "0" ]]; then
              echo
              echo "Additions outside the paths this repo owns (${unexpected}, first 20 shown):"
              echo
              echo '```'
              tr '\0' '\n' <"${RUNNER_TEMP}/tree-unexpected.z" | sed -n '1,20{s/^/    /;p}'
              echo '```'
            fi
            echo
            echo "Sync with \`git fetch upstream main && git merge --no-commit upstream/main\` - see"
            echo "\`local-patches/README.md\`."
          } >>"${GITHUB_STEP_SUMMARY}"
          echo "::warning::Fork tree (${safe_ref}) differs from upstream main (${upstream_sha}): ${offending} entries that are not files this repo adds (${nonadditive} changed or deleted, ${unexpected} unexpected additions)"
          if [[ "${issues_enabled}" == "unknown" ]]; then
            echo "Could not read .has_issues for ${GITHUB_REPOSITORY}, so this lag is reported in this summary and the annotation above only." >>"${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          if [[ "${issues_enabled}" != "true" ]]; then
            echo "Issues are not enabled on ${GITHUB_REPOSITORY}, so this lag is reported in this summary and the annotation above only." >>"${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          body="The fork tree (\`${forked}\`) is no longer upstream main (\`${upstream_sha}\`) plus the files this repo adds: ${offending} entries (${nonadditive} changed or deleted upstream files, ${unexpected} unexpected additions). Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if ! existing="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --limit 1000 --json number,title --jq 'map(select(.title == "Fork tree is behind upstream main")) | .[0].number // empty')"; then
            existing=""
            echo "::warning::could not list issues while looking for an open lag issue"
          fi
          if [[ -n "${existing}" ]]; then
            gh issue comment "${existing}" --repo "${GITHUB_REPOSITORY}" --body "${body}" \
              || echo "::warning::could not comment on the lag issue"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "Fork tree is behind upstream main" --body "${body}" \
              || echo "::warning::could not create the lag issue"
          fi

      - name: Note a current tree and close any open lag issue
        if: steps.tree.outputs.offending == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          FORK_REF: ${{ inputs.fork_ref || 'main' }}
        run: |
          set -euo pipefail
          forked="${FORK_REF}"
          safe_ref="$(printf '%s' "${forked}" | tr -c 'A-Za-z0-9._/-' '_')"
          upstream_sha="${{ steps.tree.outputs.upstream_sha }}"
          issues_enabled="${{ steps.tree.outputs.issues_enabled }}"
          echo "Fork tree (${safe_ref}) is upstream ${upstream_sha} plus the files this repo adds." >>"${GITHUB_STEP_SUMMARY}"
          if [[ "${issues_enabled}" != "true" ]]; then
            exit 0
          fi
          if ! existing="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --limit 1000 --json number,title --jq 'map(select(.title == "Fork tree is behind upstream main")) | .[0].number // empty')"; then
            existing=""
            echo "::warning::could not list issues while looking for an open lag issue"
          fi
          if [[ -n "${existing}" ]]; then
            gh issue close "${existing}" --repo "${GITHUB_REPOSITORY}" \
              --comment "Fork tree is current with upstream \`${upstream_sha}\` again." \
              || echo "::warning::could not close the lag issue"
          fi
